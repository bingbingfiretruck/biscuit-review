name = "biscuit-review-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 自定义域名：workers.dev 在国内被 DNS 污染，页面改走 api.xsbingbing.top（zone 须已在账号内激活）
routes = [{ pattern = "api.xsbingbing.top", custom_domain = true }]
workers_dev = true  # 保留 workers.dev 地址作为备用（国外可直连）

[[d1_databases]]
binding = "DB"
database_name = "biscuit-review"
database_id = "b9d9554b-dcea-4608-bd1b-538e821c0aae"
migrations_dir = "migrations"

# 视频存储二选一：免费无需绑卡用 KV；以后要 10 GB 可改用 R2（binding = "VIDEOS"）
[[kv_namespaces]]
binding = "VIDEO_KV"
id = "b9f1ada8b32d4cf7acfc1ab61b77c553"

[vars]
ALLOWED_ORIGINS = "https://bingbingfiretruck.github.io,http://localhost:8788,http://127.0.0.1:8788"
