<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f4f3">
<title>饼干在线审片 · 管理台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 4a20 20 0 1 0 19.6 24.2 7 7 0 0 1-8.4-8.4 7 7 0 0 1-7-7A7 7 0 0 1 24 4z' fill='%23e7b57b' stroke='%23b07a3f' stroke-width='2.5' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='20' r='2.6' fill='%236b3f1f'/%3E%3Ccircle cx='22' cy='31' r='2.6' fill='%236b3f1f'/%3E%3Ccircle cx='32' cy='34' r='2.2' fill='%236b3f1f'/%3E%3Ccircle cx='13' cy='30' r='1.8' fill='%236b3f1f'/%3E%3Ccircle cx='29' cy='24' r='1.8' fill='%236b3f1f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css?v=1">
<link rel="stylesheet" href="css/base.css?v=1">
<link rel="stylesheet" href="css/admin.css?v=1">
<script>
  try { var t = JSON.parse(localStorage.getItem('biscuit.theme')); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="admin">
  <header class="topbar">
    <div class="brand">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M24 4a20 20 0 1 0 19.6 24.2 7 7 0 0 1-8.4-8.4 7 7 0 0 1-7-7A7 7 0 0 1 24 4z" fill="#e7b57b" stroke="#b07a3f" stroke-width="2.5" stroke-linejoin="round"/><circle cx="16" cy="20" r="2.6" fill="#6b3f1f"/><circle cx="22" cy="31" r="2.6" fill="#6b3f1f"/><circle cx="32" cy="34" r="2.2" fill="#6b3f1f"/><circle cx="13" cy="30" r="1.8" fill="#6b3f1f"/><circle cx="29" cy="24" r="1.8" fill="#6b3f1f"/></svg>
      </span>
      <span class="brand__copy">
        <span class="brand__name">饼干 · 在线审片</span>
        <span class="brand__sub">管理台 · 建项目、发链接</span>
      </span>
    </div>
    <div class="topbar__right">
      <span class="chip chip--muted" id="modeChip" hidden>本地模式</span>
      <button class="btn btn--ghost btn--sm" id="themeBtn" type="button" aria-label="切换界面主题">黑夜</button>
    </div>
  </header>

  <div id="banner" hidden></div>

  <section class="card" id="keyCard" hidden>
    <div class="card__title">输入管理口令</div>
    <p class="hint">管理台只给饼干自己用。口令在部署 Worker 时设置（ADMIN_KEY），输入一次后这台设备会记住。</p>
    <form class="row" id="keyForm">
      <input class="input grow" type="password" id="keyInput" autocomplete="current-password" placeholder="管理口令" aria-label="管理口令">
      <button class="btn btn--primary" type="submit">进入</button>
    </form>
  </section>

  <div id="app" hidden>
    <section class="card" id="createCard">
      <div class="card__head">
        <div class="card__title">新建审片项目</div>
        <span class="eyebrow">一个项目 = 一条视频的全部版本</span>
      </div>
      <form class="stack" id="createForm">
        <div class="form-grid">
          <div class="field">
            <label for="nameInput">项目名</label>
            <input class="input" type="text" id="nameInput" maxlength="80" placeholder="例如：国庆湖州 vlog" required>
          </div>
          <div class="field">
            <label for="fpsInput">帧率</label>
            <select class="input" id="fpsInput">
              <option value="24">24 fps</option>
              <option value="25">25 fps</option>
              <option value="30" selected>30 fps</option>
              <option value="50">50 fps</option>
              <option value="60">60 fps</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>V1 客稿视频</label>
          <div class="file-pick">
            <input type="file" id="videoInput" class="vh" accept="video/*,.mp4,.mov,.m4v,.webm">
            <label class="btn" for="videoInput">选择视频文件</label>
            <div class="file-pick__meta" id="videoMeta"><span class="muted">只记录文件名、大小和时长，不上传。选剪辑师发给你的那个文件。</span></div>
          </div>
        </div>
        <button class="btn btn--primary" type="submit" id="createBtn">创建项目并生成链接</button>
      </form>
    </section>

    <section class="card links-card" id="linksCard" hidden></section>

    <section class="card">
      <div class="card__head">
        <div class="card__title">全部项目</div>
        <button class="btn btn--ghost btn--sm" type="button" id="refreshBtn">刷新</button>
      </div>
      <div class="project-list" id="projectList"></div>
    </section>
  </div>
</div>
<script type="module" src="js/admin.js?v=1"></script>
</body>
</html>
